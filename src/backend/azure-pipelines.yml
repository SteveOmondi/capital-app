# Azure DevOps CI/CD Pipeline for Capital FM Backend Gateway
# Target Compute: Azure Container Apps (ACA) - Scale-to-Zero ($0.00 - $5.00/month)
# Container Registry: Docker Hub
# Region: South Africa North (southafricanorth)

trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: 'ubuntu-latest'

# =========================================================================
# Azure DevOps Variable Group & Pipeline Variables
# Configure Variable Group 'capital-app-vg' under Pipelines -> Library in Azure DevOps
# =========================================================================
variables:
  - group: capital-app-vg # Azure DevOps Library Variable Group name

  # Service Connection Names
  - name: dockerHubServiceConnection
    value: 'DockerHub-ServiceConnection'
  - name: azureServiceConnection
    value: 'Azure-StayHere-Conn'

  # Docker Hub Credentials & Image Config
  - name: dockerHubUsername
    value: 'jimane254'
  - name: imageRepository
    value: 'capital-app'

  # Azure Resource & Region Config
  - name: resourceGroup
    value: 'rg-capital-prod'
  - name: containerAppName
    value: 'ca-capital-backend-api'
  - name: azureLocation
    value: 'southafricanorth'

stages:
  # =========================================================================
  # STAGE 1: Continuous Integration (Test & Build)
  # =========================================================================
  - stage: TestAndBuild
    displayName: '1. Test & Build (CI)'
    jobs:
      - job: TestAndBuildJob
        displayName: 'Run Tests & Compile TypeScript'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js 18.x'

          - script: |
              cd src/backend
              npm ci
            displayName: 'Install Dependencies'

          - script: |
              cd src/backend
              npx prisma generate
            env:
              DATABASE_URL: $(DATABASE_URL)
            displayName: 'Generate Prisma Client'

          - script: |
              cd src/backend
              npx tsc --noEmit
            displayName: 'Check TypeScript Compilation'

          - script: |
              cd src/backend
              npm test
            env:
              DATABASE_URL: $(DATABASE_URL)
              REDIS_HOST: $(REDIS_HOST)
              REDIS_PORT: $(REDIS_PORT)
              REDIS_PASSWORD: $(REDIS_PASSWORD)
              WP_WEBHOOK_SECRET: $(WP_WEBHOOK_SECRET)
              WP_CMS_BASE_URL: $(WP_CMS_BASE_URL)
              PODCAST_RSS_URL: $(PODCAST_RSS_URL)
              LIVE_STREAM_PRIMARY_URL: $(LIVE_STREAM_PRIMARY_URL)
              LIVE_STREAM_FALLBACK_URL: $(LIVE_STREAM_FALLBACK_URL)
              ICY_STREAM_URL: $(ICY_STREAM_URL)
              FIREBASE_PROJECT_ID: $(FIREBASE_PROJECT_ID)
              FIREBASE_CLIENT_EMAIL: $(FIREBASE_CLIENT_EMAIL)
              FIREBASE_PRIVATE_KEY: $(FIREBASE_PRIVATE_KEY)
            displayName: 'Execute Jest Test Suite'

  # =========================================================================
  # STAGE 2: Build & Push Docker Image to Docker Hub
  # =========================================================================
  - stage: DockerBuildAndPush
    displayName: '2. Docker Build & Push (Docker Hub)'
    dependsOn: TestAndBuild
    condition: succeeded()
    jobs:
      - job: DockerJob
        displayName: 'Build & Push Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: 'login'
              containerRegistry: '$(dockerHubServiceConnection)'

          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(dockerHubUsername)/$(imageRepository)'
              dockerfile: '$(Build.SourcesDirectory)/src/backend/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/backend'
              tags: |
                $(Build.BuildId)
                latest

  # =========================================================================
  # STAGE 3: Deploy to Azure Container Apps (CD)
  # =========================================================================
  - stage: DeployToAzureContainerApps
    displayName: '3. Deploy to Azure Container Apps'
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: 'Update / Provision Azure Container App'
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy Container Image to Azure Container Apps'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Installing containerapp extension..."
                az extension add --name containerapp --upgrade

                echo "Ensuring Resource Group $(resourceGroup) exists in $(azureLocation)..."
                az group create --name $(resourceGroup) --location "$(azureLocation)"

                echo "Checking if Azure Container App $(containerAppName) exists in $(resourceGroup)..."
                if az containerapp show --name $(containerAppName) --resource-group $(resourceGroup) &>/dev/null; then
                  echo "Updating existing Azure Container App $(containerAppName)..."
                  az containerapp update \
                    --name $(containerAppName) \
                    --resource-group $(resourceGroup) \
                    --image $(dockerHubUsername)/$(imageRepository):$(Build.BuildId)
                else
                  echo "Container app $(containerAppName) does not exist. Creating new Container App in $(azureLocation)..."
                  ENV_NAME="env-$(resourceGroup)"
                  if ! az containerapp env show --name $ENV_NAME --resource-group $(resourceGroup) &>/dev/null; then
                    echo "Creating Container Apps Managed Environment $ENV_NAME in $(azureLocation)..."
                    az containerapp env create \
                      --name $ENV_NAME \
                      --resource-group $(resourceGroup) \
                      --location "$(azureLocation)"
                  fi

                  az containerapp create \
                    --name $(containerAppName) \
                    --resource-group $(resourceGroup) \
                    --environment $ENV_NAME \
                    --image $(dockerHubUsername)/$(imageRepository):$(Build.BuildId) \
                    --target-port 3000 \
                    --ingress external \
                    --min-replicas 0 \
                    --max-replicas 5 \
                    --env-vars \
                      NODE_ENV=production \
                      PORT=3000 \
                      LOG_LEVEL=info \
                      DATABASE_URL="$(DATABASE_URL)" \
                      REDIS_HOST="$(REDIS_HOST)" \
                      REDIS_PORT="$(REDIS_PORT)" \
                      REDIS_PASSWORD="$(REDIS_PASSWORD)" \
                      WP_WEBHOOK_SECRET="$(WP_WEBHOOK_SECRET)" \
                      WP_CMS_BASE_URL="$(WP_CMS_BASE_URL)" \
                      PODCAST_RSS_URL="$(PODCAST_RSS_URL)" \
                      LIVE_STREAM_PRIMARY_URL="$(LIVE_STREAM_PRIMARY_URL)" \
                      LIVE_STREAM_FALLBACK_URL="$(LIVE_STREAM_FALLBACK_URL)" \
                      ICY_STREAM_URL="$(ICY_STREAM_URL)" \
                      FIREBASE_PROJECT_ID="$(FIREBASE_PROJECT_ID)" \
                      FIREBASE_CLIENT_EMAIL="$(FIREBASE_CLIENT_EMAIL)" \
                      FIREBASE_PRIVATE_KEY="$(FIREBASE_PRIVATE_KEY)"
                fi
