# Azure DevOps CI/CD Pipeline for Self-Hosted Docker Production Deployment
# Target Compute: Linux Server via SSH (azdevops@$(PROD_SSH_HOST) under /opt/apps/capital-app)
# Container Registry: Docker Hub

trigger: []
pr: []

pool:
  vmImage: 'ubuntu-latest'

# =========================================================================
# Azure DevOps Variable Group & Pipeline Variables
# Configure Variable Group 'capital-app-vg' under Pipelines -> Library
# =========================================================================
variables:
  - group: capital-app-vg # Azure DevOps Library Variable Group name

  # Service Connections & Secure Files
  - name: dockerHubServiceConnection
    value: 'DockerHub-ServiceConnection'
  - name: SSH_KEY_SECURE_FILE_NAME
    value: 'id_azdevops'
  - name: FIREBASE_P12_SECURE_FILE_NAME
    value: 'capitalfmapp-12169-8f7afd5cc58a.p12'

  # Docker Image Configuration
  - name: dockerHubUsername
    value: 'jimane254'
  - name: imageRepository
    value: 'capital-app'

  # Target SSH Connection Configuration (Host IP/Domain set in Variable Group)
  - name: PROD_SSH_USER
    value: 'azdevops'
  - name: PROD_SSH_PORT
    value: '22'

  # Containerized Infrastructure Flags (Set to false if connecting to external DB/Redis)
  - name: DEPLOY_CONTAINERIZED_DB
    value: 'true'
  - name: DEPLOY_CONTAINERIZED_REDIS
    value: 'true'

stages:
  # =========================================================================
  # STAGE 1: Continuous Integration (Test & Build)
  # =========================================================================
  - stage: TestAndBuild
    displayName: '1. Test & Build (CI)'
    jobs:
      - job: TestAndBuildJob
        displayName: 'Run Tests & Compile TypeScript'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js 18.x'

          - script: |
              cd src/backend
              npm ci
            displayName: 'Install Dependencies'

          - script: |
              cd src/backend
              npx prisma generate
            env:
              DATABASE_URL: $(DATABASE_URL)
            displayName: 'Generate Prisma Client'

          - script: |
              cd src/backend
              npx tsc --noEmit
            displayName: 'Check TypeScript Compilation'

          - task: DownloadSecureFile@1
            name: firebaseCert
            displayName: 'Download Firebase PKCS12 Certificate'
            inputs:
              secureFile: '$(FIREBASE_P12_SECURE_FILE_NAME)'

          - script: |
              P12_B64=$(base64 -w 0 $(firebaseCert.secureFilePath))
              echo "##vso[task.setvariable variable=FIREBASE_P12_BASE64;isSecret=true]$P12_B64"
            displayName: 'Encode PKCS12 Certificate'

          - script: |
              cd src/backend
              npm test
            env:
              DATABASE_URL: $(DATABASE_URL)
              REDIS_HOST: $(REDIS_HOST)
              REDIS_PORT: $(REDIS_PORT)
              REDIS_PASSWORD: $(REDIS_PASSWORD)
              WP_WEBHOOK_SECRET: $(WP_WEBHOOK_SECRET)
              WP_CMS_BASE_URL: $(WP_CMS_BASE_URL)
              PODCAST_RSS_URL: $(PODCAST_RSS_URL)
              LIVE_STREAM_PRIMARY_URL: $(LIVE_STREAM_PRIMARY_URL)
              LIVE_STREAM_FALLBACK_URL: $(LIVE_STREAM_FALLBACK_URL)
              ICY_STREAM_URL: $(ICY_STREAM_URL)
              FIREBASE_PROJECT_ID: $(FIREBASE_PROJECT_ID)
              FIREBASE_CLIENT_EMAIL: $(FIREBASE_CLIENT_EMAIL)
              FIREBASE_PRIVATE_KEY: $(FIREBASE_PRIVATE_KEY)
              FIREBASE_P12_PATH: $(firebaseCert.secureFilePath)
              FIREBASE_P12_PASSPHRASE: $(FIREBASE_P12_PASSPHRASE)
              FIREBASE_P12_BASE64: $(FIREBASE_P12_BASE64)
              STREAMGUYS_HOST: $(STREAMGUYS_HOST)
              STREAMGUYS_CLIENT_ID: $(STREAMGUYS_CLIENT_ID)
              STREAMGUYS_CLIENT_SECRET: $(STREAMGUYS_CLIENT_SECRET)
              STREAMGUYS_USERNAME: $(STREAMGUYS_USERNAME)
              STREAMGUYS_PASSWORD: $(STREAMGUYS_PASSWORD)
            displayName: 'Execute Jest Test Suite'

  # =========================================================================
  # STAGE 2: Build & Push Docker Image to Docker Hub
  # =========================================================================
  - stage: DockerBuildAndPush
    displayName: '2. Docker Build & Push (Docker Hub)'
    dependsOn: TestAndBuild
    condition: succeeded()
    jobs:
      - job: DockerJob
        displayName: 'Build & Push Docker Image'
        steps:
          - task: Docker@2
            displayName: 'Login to Docker Hub'
            inputs:
              command: 'login'
              containerRegistry: '$(dockerHubServiceConnection)'

          - task: Docker@2
            displayName: 'Build and Push Docker Image'
            inputs:
              command: 'buildAndPush'
              repository: '$(dockerHubUsername)/$(imageRepository)'
              dockerfile: '$(Build.SourcesDirectory)/src/backend/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/src/backend'
              tags: |
                $(Build.BuildId)
                latest

  # =========================================================================
  # STAGE 3: SSH Production Deployment & Healthcheck Rollback (CD)
  # =========================================================================
  - stage: DeployToProductionSSH
    displayName: '3. SSH Production Deploy & Rollback'
    dependsOn: DockerBuildAndPush
    condition: succeeded()
    jobs:
      - job: SSHDeployJob
        displayName: 'Deploy Services to /opt/apps/capital-app via SSH'
        steps:
          - task: DownloadSecureFile@1
            name: sshKey
            displayName: 'Download SSH Private Key Secure File'
            inputs:
              secureFile: '$(SSH_KEY_SECURE_FILE_NAME)'

          - task: DownloadSecureFile@1
            name: firebaseCert
            displayName: 'Download Firebase PKCS12 Certificate'
            inputs:
              secureFile: '$(FIREBASE_P12_SECURE_FILE_NAME)'

          - script: |
              P12_B64=$(base64 -w 0 $(firebaseCert.secureFilePath))
              echo "##vso[task.setvariable variable=FIREBASE_P12_BASE64;isSecret=true]$P12_B64"
            displayName: 'Encode PKCS12 Certificate for Remote Host'

          - script: |
              set -e
              chmod 600 $(sshKey.secureFilePath)
              SSH_CMD="ssh -p $(PROD_SSH_PORT) -o StrictHostKeyChecking=no -i $(sshKey.secureFilePath)"
              SCP_CMD="scp -P $(PROD_SSH_PORT) -o StrictHostKeyChecking=no -i $(sshKey.secureFilePath)"

              echo "Ensuring target directory structure exists on $(PROD_SSH_HOST)..."
              $SSH_CMD $(PROD_SSH_USER)@$(PROD_SSH_HOST) "mkdir -p /opt/apps/capital-app/scripts /opt/apps/capital-app/nginx"

              echo "Copying deployment configuration, NGINX config, and scripts to $(PROD_SSH_HOST)..."
              $SCP_CMD src/backend/docker-compose.prod.yml $(PROD_SSH_USER)@$(PROD_SSH_HOST):/opt/apps/capital-app/docker-compose.prod.yml
              $SCP_CMD src/backend/nginx/nginx.conf $(PROD_SSH_USER)@$(PROD_SSH_HOST):/opt/apps/capital-app/nginx/nginx.conf
              $SCP_CMD src/backend/scripts/deploy-ssh.sh $(PROD_SSH_USER)@$(PROD_SSH_HOST):/opt/apps/capital-app/scripts/deploy-ssh.sh
              $SSH_CMD $(PROD_SSH_USER)@$(PROD_SSH_HOST) "chmod +x /opt/apps/capital-app/scripts/deploy-ssh.sh"

              echo "Generating runtime .env file safely on pipeline agent..."
              cat << 'EOF' > /tmp/runtime.env
NODE_ENV=production
PORT=3000
LOG_LEVEL=info
PUBLIC_BASE_URL=https://api.datalait.co.ke
POSTGRES_USER=$(POSTGRES_USER)
POSTGRES_PASSWORD=$(POSTGRES_PASSWORD)
POSTGRES_DB=$(POSTGRES_DB)
DATABASE_URL=$(DATABASE_URL)
REDIS_HOST=$(REDIS_HOST)
REDIS_PORT=$(REDIS_PORT)
REDIS_PASSWORD=$(REDIS_PASSWORD)
WP_WEBHOOK_SECRET=$(WP_WEBHOOK_SECRET)
WP_CMS_BASE_URL=$(WP_CMS_BASE_URL)
PODCAST_RSS_URL=$(PODCAST_RSS_URL)
LIVE_STREAM_PRIMARY_URL=$(LIVE_STREAM_PRIMARY_URL)
LIVE_STREAM_FALLBACK_URL=$(LIVE_STREAM_FALLBACK_URL)
ICY_STREAM_URL=$(ICY_STREAM_URL)
FIREBASE_PROJECT_ID=$(FIREBASE_PROJECT_ID)
FIREBASE_CLIENT_EMAIL=$(FIREBASE_CLIENT_EMAIL)
FIREBASE_PRIVATE_KEY=$(FIREBASE_PRIVATE_KEY)
FIREBASE_P12_PASSPHRASE=$(FIREBASE_P12_PASSPHRASE)
FIREBASE_P12_BASE64=$(FIREBASE_P12_BASE64)
STREAMGUYS_HOST=$(STREAMGUYS_HOST)
STREAMGUYS_CLIENT_ID=$(STREAMGUYS_CLIENT_ID)
STREAMGUYS_CLIENT_SECRET=$(STREAMGUYS_CLIENT_SECRET)
STREAMGUYS_USERNAME=$(STREAMGUYS_USERNAME)
STREAMGUYS_PASSWORD=$(STREAMGUYS_PASSWORD)
EOF

              $SCP_CMD /tmp/runtime.env $(PROD_SSH_USER)@$(PROD_SSH_HOST):/opt/apps/capital-app/.env

              echo "Triggering remote deployment and healthcheck verification..."
              $SSH_CMD $(PROD_SSH_USER)@$(PROD_SSH_HOST) \
                "DOCKER_IMAGE=$(dockerHubUsername)/$(imageRepository) \
                 DOCKER_IMAGE_TAG=$(Build.BuildId) \
                 DEPLOY_CONTAINERIZED_DB=$(DEPLOY_CONTAINERIZED_DB) \
                 DEPLOY_CONTAINERIZED_REDIS=$(DEPLOY_CONTAINERIZED_REDIS) \
                 /opt/apps/capital-app/scripts/deploy-ssh.sh"
            displayName: 'Execute SSH Deployment, Healthchecks & Rollback'

  # =========================================================================
  # STAGE 4: Automated Post-Deployment Load Testing
  # =========================================================================
  - stage: AutomatedLoadTest
    displayName: '4. Post-Deploy Streaming Load Test'
    dependsOn: DeployToProductionSSH
    condition: succeeded()
    jobs:
      - job: LoadTestVerificationJob
        displayName: 'Run Streaming & API Concurrency Load Test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js 18.x'

          - script: |
              cd src/backend
              npm ci
            displayName: 'Install Dependencies'

          - script: |
              cd src/backend
              npx ts-node scripts/loadtest.ts --target=https://api.datalait.co.ke --mode=mixed --vus=200 --duration=30 --ramp=5
            env:
              DISABLE_RATE_LIMIT: 'true'
            displayName: 'Execute Automated Streaming Load Test'
